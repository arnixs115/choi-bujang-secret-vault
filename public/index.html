<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice {
      margin: 26px 0;
      padding: 18px;
      border: 1px solid #d07384;
      border-radius: 14px;
      color: #ffe3e8;
      background: #612a3544;
    }

    .auth {
      margin: 26px 0;
      padding: 20px;
      border: 1px solid #51667c;
      border-radius: 14px;
      background: #162638;
    }

    .auth h2 {
      margin-top: 0;
    }

    .auth form {
      display: grid;
      gap: 12px;
    }

    .auth label {
      display: grid;
      gap: 6px;
      color: #bfd0e5;
    }

    .auth input,
    .auth button {
      box-sizing: border-box;
      width: 100%;
      padding: 11px 12px;
      border-radius: 9px;
      border: 1px solid #51667c;
      background: #101a28;
      color: #ecf4ff;
      font: inherit;
    }

    .auth button {
      cursor: pointer;
      background: #24445a;
    }

    .auth button:hover {
      background: #2d5872;
    }

    .status {
      margin: 12px 0 0;
      color: #8ad8df;
    }

    .error {
      color: #ffb8c2;
    }

    ul {
      list-style: none;
      display: grid;
      gap: 12px;
      padding: 0;
    }

    li {
      border: 1px solid #51667c;
      border-radius: 14px;
      padding: 17px 19px;
      background: #1a2a3d;
    }

    strong {
      display: block;
      font-size: 18px;
      margin-bottom: 5px;
    }

    li span {
      color: #bfd0e5;
    }
  </style>
</head>

<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 로그인</div>

    <h1>점령된 자료실</h1>

    <p>
      Supabase Auth를 이용해 자료실의 로그인 상태를 관리합니다.
    </p>

    <section class="auth" aria-labelledby="auth-title">
      <h2 id="auth-title">자료실 로그인</h2>

      <form id="login-form">
        <label>
          이메일
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
          >
        </label>

        <label>
          비밀번호
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          >
        </label>

        <button type="submit">로그인</button>
      </form>

      <div id="logged-in" hidden>
        <p id="user-status" class="status"></p>
        <button id="logout" type="button">로그아웃</button>
      </div>

      <p
        id="auth-message"
        class="status"
        role="status"
        aria-live="polite"
      ></p>
    </section>

    <div class="notice">
      현재 단계에서는 로그인·로그아웃 화면과 인증 상태만 연결합니다.
      자료 접근 제한은 다음 단계에서 처리합니다.
    </div>

    <section class="auth" aria-labelledby="memo-title">
      <h2 id="memo-title">가상 메모</h2>

      <form id="memo-form">
        <label>
          제목
          <input id="memo-title-input" type="text" required>
        </label>

        <label>
          내용
          <textarea id="memo-body-input" rows="5" required></textarea>
        </label>

        <button type="submit">메모 추가</button>
        <button id="cancel-edit" type="button" hidden>
          수정 취소
        </button>
      </form>

      <p
        id="memo-message"
        class="status"
        role="status"
        aria-live="polite"
      ></p>
    </section>

    <ul id="notes" aria-live="polite">
      <li>로그인하면 메모를 불러옵니다.</li>
    </ul>
  </main>

  <script type="module">
    import {
      createClient
    } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL =
      'https://olwswefbgsglptdvhlbf.supabase.co';

    const SUPABASE_PUBLISHABLE_KEY =
      'sb_publishable_sOCAdKdZx7YOWe_v5FHytA_HEx3m6fZ';

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const loginForm = document.querySelector('#login-form');
    const logoutButton = document.querySelector('#logout');
    const loggedIn = document.querySelector('#logged-in');
    const userStatus = document.querySelector('#user-status');
    const authMessage = document.querySelector('#auth-message');

    function renderAuthState(session) {
      const user = session?.user ?? null;

      loginForm.hidden = Boolean(user);
      loggedIn.hidden = !user;

      userStatus.textContent =
        user ? `로그인됨: ${user.email}` : '';
    }

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      authMessage.className = 'status';
      authMessage.textContent = '로그인 중입니다.';

      const email =
        document.querySelector('#email').value.trim();

      const password =
        document.querySelector('#password').value;

      const { error } =
        await supabase.auth.signInWithPassword({
          email,
          password
        });

      if (error) {
        authMessage.className = 'status error';
        authMessage.textContent =
          `로그인 실패: ${error.message}`;
        return;
      }

      loginForm.reset();
      authMessage.textContent = '로그인되었습니다.';
    });

    logoutButton.addEventListener('click', async () => {
      authMessage.className = 'status';
      authMessage.textContent = '로그아웃 중입니다.';

      const { error } =
        await supabase.auth.signOut({
          scope: 'local'
        });

      if (error) {
        authMessage.className = 'status error';
        authMessage.textContent =
          `로그아웃 실패: ${error.message}`;
        return;
      }

      authMessage.textContent = '로그아웃되었습니다.';
    });

    supabase.auth.onAuthStateChange(
      (event, session) => {
        renderAuthState(session);

        if (event === 'SIGNED_OUT') {
          authMessage.textContent =
            '로그아웃되었습니다.';
        }
      }
    );

    const {
      data: { session }
    } = await supabase.auth.getSession();

    renderAuthState(session);

    const list = document.querySelector('#notes');

    const memoForm =
      document.querySelector('#memo-form');

    const memoTitleInput =
      document.querySelector('#memo-title-input');

    const memoBodyInput =
      document.querySelector('#memo-body-input');

    const cancelEditButton =
      document.querySelector('#cancel-edit');

    const memoMessage =
      document.querySelector('#memo-message');

    let editingId = null;

    async function getAuthHeaders() {
      const {
        data: { session },
        error
      } = await supabase.auth.getSession();

      if (error || !session?.access_token) {
        throw new Error('로그인이 필요합니다.');
      }

      return {
        Authorization: `Bearer ${session.access_token}`,
        'Content-Type': 'application/json'
      };
    }

    async function apiRequest(url, options = {}) {
      const response = await fetch(url, {
        cache: 'no-store',
        ...options,
        headers: {
          ...(await getAuthHeaders()),
          ...(options.headers ?? {})
        }
      });

      let data = null;

      try {
        data = await response.json();
      } catch {}

      if (!response.ok) {
        throw new Error(
          data?.error ?? '요청에 실패했습니다.'
        );
      }

      return data;
    }

    async function loadNotes() {
      try {
        const notes =
          await apiRequest('/api/notes');

        if (!Array.isArray(notes)) {
          throw new Error('자료 형식이 맞지 않습니다.');
        }

        if (notes.length === 0) {
          const item =
            document.createElement('li');

          item.textContent =
            '아직 메모가 없습니다.';

          list.replaceChildren(item);
          return;
        }

        list.replaceChildren(
          ...notes.map(note => {
            const item =
              document.createElement('li');

            const title =
              document.createElement('strong');

            const body =
              document.createElement('span');

            const edit =
              document.createElement('button');

            const remove =
              document.createElement('button');

            title.textContent = note.title;
            body.textContent = note.body;

            edit.textContent = '수정';
            remove.textContent = '삭제';

            edit.type = 'button';
            remove.type = 'button';

            edit.addEventListener('click', () => {
              editingId = note.id;

              memoTitleInput.value =
                note.title;

              memoBodyInput.value =
                note.body;

              memoForm.querySelector(
                'button[type="submit"]'
              ).textContent = '메모 수정';

              cancelEditButton.hidden = false;
            });

            remove.addEventListener(
              'click',
              async () => {
                if (!confirm('이 메모를 삭제할까요?')) {
                  return;
                }

                try {
                  await apiRequest(
                    `/api/notes/${note.id}`,
                    { method: 'DELETE' }
                  );

                  memoMessage.textContent =
                    '메모가 삭제되었습니다.';

                  await loadNotes();
                } catch (error) {
                  memoMessage.className =
                    'status error';

                  memoMessage.textContent =
                    error.message;
                }
              }
            );

            item.append(
              title,
              body,
              document.createElement('br'),
              edit,
              ' ',
              remove
            );

            return item;
          })
        );
      } catch (error) {
        const item =
          document.createElement('li');

        item.textContent = error.message;

        list.replaceChildren(item);
      }
    }

    memoForm.addEventListener(
      'submit',
      async event => {
        event.preventDefault();

        try {
          const payload = {
            title: memoTitleInput.value.trim(),
            body: memoBodyInput.value
          };

          if (editingId) {
            await apiRequest(
              `/api/notes/${editingId}`,
              {
                method: 'PUT',
                body: JSON.stringify(payload)
              }
            );

            memoMessage.textContent =
              '메모가 수정되었습니다.';
          } else {
            const result =
              await apiRequest(
                '/api/notes',
                {
                  method: 'POST',
                  body: JSON.stringify(payload)
                }
              );

            memoMessage.textContent =
              `메모가 추가되었습니다. ID: ${result.id}`;
          }

          memoMessage.className = 'status';

          editingId = null;
          memoForm.reset();

          memoForm.querySelector(
            'button[type="submit"]'
          ).textContent = '메모 추가';

          cancelEditButton.hidden = true;

          await loadNotes();
        } catch (error) {
          memoMessage.className =
            'status error';

          memoMessage.textContent =
            error.message;
        }
      }
    );

    cancelEditButton.addEventListener(
      'click',
      () => {
        editingId = null;

        memoForm.reset();

        memoForm.querySelector(
          'button[type="submit"]'
        ).textContent = '메모 추가';

        cancelEditButton.hidden = true;
      }
    );
  </script>
</body>
</html>
